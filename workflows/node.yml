name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci 2>/dev/null || npm install 2>/dev/null || true
      - run: npm run build --if-present 2>/dev/null || true
      - run: npm run lint --if-present 2>/dev/null || npx eslint . --ext .js,.ts --max-warnings=0 2>/dev/null || true
      - run: npm test --if-present 2>/dev/null || true
